name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: theftwatch
          POSTGRES_PASSWORD: theftwatch
          POSTGRES_DB: theftwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean compile -B

      - name: Run tests
        run: mvn test -B
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/theftwatch
          SPRING_DATASOURCE_USERNAME: theftwatch
          SPRING_DATASOURCE_PASSWORD: theftwatch

      - name: Package application
        run: mvn package -DskipTests -B

      - name: Build Docker image
        run: docker build -t theftwatch:${{ github.sha }} .
