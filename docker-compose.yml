version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: theftwatch-postgres
    environment:
      POSTGRES_USER: theftwatch
      POSTGRES_PASSWORD: theftwatch
      POSTGRES_DB: theftwatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U theftwatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: theftwatch-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: theftwatch
      MINIO_ROOT_PASSWORD: theftwatch
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  app:
    build: .
    container_name: theftwatch-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/theftwatch
      SPRING_DATASOURCE_USERNAME: theftwatch
      SPRING_DATASOURCE_PASSWORD: theftwatch
      SPRING_FLYWAY_ENABLED: "true"
      JAVA_OPTS: "-Xmx2g"
    volumes:
      - ./data/hls:/data/hls
      - ./data/videos:/data/videos
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 20s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: theftwatch-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    profiles:
      - production

volumes:
  postgres_data:
  minio_data:
