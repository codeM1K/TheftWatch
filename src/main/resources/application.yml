spring:
  application:
    name: theftwatch
  datasource:
    url: jdbc:postgresql://localhost:5432/theftwatch
    username: theftwatch
    password: theftwatch
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080
  address: 0.0.0.0

vaadin:
  frontend:
    scan-packages: com.theftwatch.theftwatch.ui
  devmode:
    live-reload: true

logging:
  level:
    com.theftwatch: DEBUG
    org.hibernate.SQL: DEBUG

app:
  ai:
    sige7:
      base-url: http://localhost:8000
      inference-timeout: 5s
  streaming:
    ffmpeg-path: ffmpeg
    segment-duration: 4
    hls-output-dir: /data/hls
  storage:
    video-base-path: /data/videos

minio:
  endpoint: http://localhost:9000
  access-key: theftwatch
  secret-key: theftwatch
  video-bucket: videos
  snapshot-bucket: snapshots
