spring:
  datasource:
    url: jdbc:h2:mem:theftwatch-test
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  ai:
    sige7:
      base-url: http://localhost:8000
      inference-timeout: 5s
